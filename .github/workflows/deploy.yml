name: Deploy a Producción — SIAF Fichas Técnicas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Asegurar permisos
        run: |
          sudo chown -R oliver:oliver /var/www/siaf-fichatecnica || true

      - name: Desplegar archivos con rsync
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='server/node_modules' \
            --exclude='client/node_modules' \
            . /var/www/siaf-fichatecnica/

      - name: Instalar dependencias del servidor
        run: |
          cd /var/www/siaf-fichatecnica/server
          npm install --omit=dev

      - name: Construir Frontend (Client)
        run: |
          cd /var/www/siaf-fichatecnica/client
          npm install
          npm run build

      - name: Restaurar .env desde backup (si no existe)
        run: |
          if [ ! -f /var/www/siaf-fichatecnica/server/.env ]; then
            cp /var/www/.env.siaf-fichatecnica /var/www/siaf-fichatecnica/server/.env
            echo "⚠️ .env restaurado desde backup"
          fi

      - name: Ejecutar migraciones pendientes
        run: |
          cd /var/www/siaf-fichatecnica/server
          npm run migrate

      - name: Permisos Nginx
        run: |
          sudo chown -R www-data:www-data /var/www/siaf-fichatecnica/client/dist

      - name: Reiniciar servidor con PM2
        run: |
          cd /var/www/siaf-fichatecnica/server
          pm2 restart siaf-fichatecnica --update-env || pm2 start src/index.js --name siaf-fichatecnica
          pm2 save
          echo "🚀 Despliegue finalizado con éxito"
